name: codex temporary ssh key cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-temporary-key:
    runs-on: ubuntu-latest
    env:
      KEY_MARKER: codex-photon-migration-20260727

    steps:
      - name: Remove temporary public key
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: KEY_MARKER
          script: |
            set -euo pipefail
            auth_keys="$HOME/.ssh/authorized_keys"
            test -f "$auth_keys"
            before_count="$(grep -cF "$KEY_MARKER" "$auth_keys" || true)"
            tmp_file="$(mktemp)"
            grep -vF "$KEY_MARKER" "$auth_keys" > "$tmp_file" || true
            install -m 600 "$tmp_file" "$auth_keys"
            rm -f "$tmp_file"
            after_count="$(grep -cF "$KEY_MARKER" "$auth_keys" || true)"
            if [ "$after_count" != "0" ]; then
              echo "temporary key marker still present after cleanup" >&2
              exit 1
            fi
            echo "temporary key cleanup complete; removed_entries=$before_count"
