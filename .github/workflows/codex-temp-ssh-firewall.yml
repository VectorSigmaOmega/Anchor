name: codex temporary ssh firewall

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allow-control-machine-ssh:
    runs-on: ubuntu-latest
    env:
      TARGET_CIDR: 163.116.199.186/32
      RULE_COMMENT: codex-temp-ssh-20260727

    steps:
      - name: Allow temporary SSH source
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TARGET_CIDR,RULE_COMMENT
          script: |
            set -euo pipefail
            if [ "$TARGET_CIDR" != "163.116.199.186/32" ]; then
              echo "refusing unexpected CIDR: $TARGET_CIDR" >&2
              exit 1
            fi

            echo "allowing temporary SSH from $TARGET_CIDR"

            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow proto tcp from "$TARGET_CIDR" to any port 22 comment "$RULE_COMMENT"
              sudo ufw status numbered || true
            else
              echo "ufw not installed"
            fi

            if command -v iptables >/dev/null 2>&1; then
              if sudo iptables -C INPUT -p tcp -s "$TARGET_CIDR" --dport 22 -j ACCEPT -m comment --comment "$RULE_COMMENT" 2>/dev/null; then
                echo "iptables rule already present"
              else
                sudo iptables -I INPUT 1 -p tcp -s "$TARGET_CIDR" --dport 22 -j ACCEPT -m comment --comment "$RULE_COMMENT"
                echo "iptables rule installed"
              fi
              sudo iptables -S INPUT | grep -F "$RULE_COMMENT"
            else
              echo "iptables not installed"
            fi

            hostname
