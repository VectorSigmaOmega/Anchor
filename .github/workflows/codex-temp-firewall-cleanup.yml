name: codex temporary firewall cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-temporary-firewall-rule:
    runs-on: ubuntu-latest
    env:
      TARGET_CIDR: 163.116.199.186/32
      RULE_COMMENT: codex-temp-ssh-20260727

    steps:
      - name: Remove temporary SSH firewall rule
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TARGET_CIDR,RULE_COMMENT
          script: |
            set -euo pipefail
            if [ "$TARGET_CIDR" != "163.116.199.186/32" ]; then
              echo "refusing unexpected CIDR: $TARGET_CIDR" >&2
              exit 1
            fi

            if command -v ufw >/dev/null 2>&1; then
              sudo ufw --force delete allow proto tcp from "$TARGET_CIDR" to any port 22 || true
              sudo ufw status numbered || true
            fi

            if command -v iptables >/dev/null 2>&1; then
              while sudo iptables -C INPUT -p tcp -s "$TARGET_CIDR" --dport 22 -j ACCEPT -m comment --comment "$RULE_COMMENT" 2>/dev/null; do
                sudo iptables -D INPUT -p tcp -s "$TARGET_CIDR" --dport 22 -j ACCEPT -m comment --comment "$RULE_COMMENT"
              done
              sudo iptables -S INPUT | grep -F "$RULE_COMMENT" || echo "temporary iptables rule removed"
            fi
