name: deploy

on:
  workflow_dispatch:
    inputs:
      run_rechunk:
        description: "Atomically rebuild chunks from verified corpus files (reuse prepared index when present)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      run_reembed:
        description: "Atomically replace corpus embeddings with the configured model"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      run_ingest:
        description: "Run corpus ingestion after deployment"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: ["main"]

concurrency:
  group: anchor-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      ANCHOR_DOMAIN: ${{ secrets.ANCHOR_DOMAIN }}
      ANCHOR_DB_PASSWORD: ${{ secrets.ANCHOR_DB_PASSWORD }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GENERATION_PROVIDER: ${{ vars.GENERATION_PROVIDER || 'gemini' }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'gemini' }}
      GENERATION_MODEL: ${{ vars.GENERATION_MODEL }}
      MULTIPART_GENERATION_MODEL: ${{ vars.MULTIPART_GENERATION_MODEL || 'gemini-3.5-flash-lite' }}
      RETRIEVAL_PLAN_MODEL: ${{ vars.RETRIEVAL_PLAN_MODEL || 'gemini-3.5-flash-lite' }}
      WORKFLOW_DRAFT_MODEL: ${{ vars.WORKFLOW_DRAFT_MODEL || 'gemini-3.8-flash' }}
      MULTIPART_WORKFLOW_ENABLED: ${{ vars.MULTIPART_WORKFLOW_ENABLED || 'false' }}
      LINEAR_SOURCE_COMPARISON_ENABLED: ${{ vars.LINEAR_SOURCE_COMPARISON_ENABLED || 'true' }}
      WORKFLOW_TOPIC_REVIEW_ENABLED: ${{ vars.WORKFLOW_TOPIC_REVIEW_ENABLED || 'true' }}
      WORKFLOW_TIMEOUT_SECONDS: ${{ vars.WORKFLOW_TIMEOUT_SECONDS || '60' }}
      RERANK_REQUEST_TIMEOUT_SECONDS: ${{ vars.RERANK_REQUEST_TIMEOUT_SECONDS || '7' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_BATCH_PAUSE_SECONDS: ${{ vars.EMBEDDING_BATCH_PAUSE_SECONDS || '10' }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
      RELEASE_SHA: ${{ github.sha }}
      RUN_INGEST: ${{ github.event.inputs.run_ingest || 'false' }}
      RUN_RECHUNK: ${{ github.event.inputs.run_rechunk || 'false' }}
      RUN_REEMBED: ${{ github.event.inputs.run_reembed || 'false' }}

    steps:
      - name: Restart application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ANCHOR_DOMAIN,ANCHOR_DB_PASSWORD,COHERE_API_KEY,GEMINI_API_KEY,OPENAI_API_KEY,GENERATION_PROVIDER,EMBEDDING_PROVIDER,GENERATION_MODEL,MULTIPART_GENERATION_MODEL,RETRIEVAL_PLAN_MODEL,WORKFLOW_DRAFT_MODEL,MULTIPART_WORKFLOW_ENABLED,LINEAR_SOURCE_COMPARISON_ENABLED,WORKFLOW_TOPIC_REVIEW_ENABLED,WORKFLOW_TIMEOUT_SECONDS,RERANK_REQUEST_TIMEOUT_SECONDS,EMBEDDING_MODEL,EMBEDDING_BATCH_PAUSE_SECONDS,LANGFUSE_HOST,LANGFUSE_PUBLIC_KEY,LANGFUSE_SECRET_KEY,LETSENCRYPT_EMAIL,RELEASE_ID,RELEASE_SHA,RUN_INGEST,RUN_REEMBED,RUN_RECHUNK
          command_timeout: 120m
          script: |
            set -euo pipefail
            test -n "$ANCHOR_DOMAIN"
            test -n "$ANCHOR_DB_PASSWORD"
            case "$GENERATION_PROVIDER" in
              gemini) test -n "$GEMINI_API_KEY"; GENERATION_MODEL="${GENERATION_MODEL:-gemini-3.1-flash-lite}" ;;
              openai) test -n "$OPENAI_API_KEY"; GENERATION_MODEL="${GENERATION_MODEL:-gpt-4.1-mini}" ;;
              *) exit 1 ;;
            esac
            case "$EMBEDDING_PROVIDER" in
              gemini) test -n "$GEMINI_API_KEY"; EMBEDDING_MODEL="${EMBEDDING_MODEL:-gemini-embedding-2}" ;;
              openai) test -n "$OPENAI_API_KEY"; EMBEDDING_MODEL="${EMBEDDING_MODEL:-text-embedding-3-small}" ;;
              *) exit 1 ;;
            esac
            test -n "$COHERE_API_KEY"
            test -n "$LANGFUSE_PUBLIC_KEY"
            test -n "$LANGFUSE_SECRET_KEY"
            test -n "$LETSENCRYPT_EMAIL"
            if ! id anchor >/dev/null 2>&1; then
              sudo useradd --system --home /opt/anchor --shell /usr/sbin/nologin anchor
            fi
            sudo apt-get update
            sudo apt-get install -y \
              certbot \
              curl \
              nginx \
              postgresql \
              postgresql-client \
              postgresql-contrib \
              postgresql-16-pgvector \
              python3-certbot-nginx \
              python3-venv \
              rsync
            if ! command -v node >/dev/null 2>&1 || [ "$(node -p 'Number(process.versions.node.split(".")[0])')" -lt 20 ]; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            sudo systemctl enable --now postgresql
            sudo -u postgres psql -v ON_ERROR_STOP=1 <<SQL
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anchor') THEN
                CREATE ROLE anchor LOGIN PASSWORD '$ANCHOR_DB_PASSWORD';
              ELSE
                ALTER ROLE anchor WITH LOGIN PASSWORD '$ANCHOR_DB_PASSWORD';
              END IF;
            END
            \$\$;
            SELECT 'CREATE DATABASE anchor OWNER anchor'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'anchor')\gexec
            SQL
            sudo -u postgres psql -d anchor -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
            sudo install -d -m 0750 -o root -g anchor /etc/anchor
            sudo install -d -m 0750 -o anchor -g anchor /var/lib/anchor/corpus/raw
            sudo tee /etc/anchor/anchor.env >/dev/null <<ANCHOR_ENV
            DATABASE_URL=postgresql://anchor:$ANCHOR_DB_PASSWORD@localhost:5432/anchor
            ENVIRONMENT=production
            RAW_CORPUS_DIR=/var/lib/anchor/corpus/raw
            GEMINI_API_KEY=$GEMINI_API_KEY
            OPENAI_API_KEY=$OPENAI_API_KEY
            GENERATION_PROVIDER=$GENERATION_PROVIDER
            EMBEDDING_PROVIDER=$EMBEDDING_PROVIDER
            GEMINI_API_BASE_URL=https://generativelanguage.googleapis.com/v1beta/models
            GENERATION_MODEL=$GENERATION_MODEL
            MULTIPART_GENERATION_MODEL=$MULTIPART_GENERATION_MODEL
            RETRIEVAL_PLAN_MODEL=$RETRIEVAL_PLAN_MODEL
            WORKFLOW_DRAFT_MODEL=$WORKFLOW_DRAFT_MODEL
            MULTIPART_WORKFLOW_ENABLED=$MULTIPART_WORKFLOW_ENABLED
            LINEAR_SOURCE_COMPARISON_ENABLED=$LINEAR_SOURCE_COMPARISON_ENABLED
            WORKFLOW_TOPIC_REVIEW_ENABLED=$WORKFLOW_TOPIC_REVIEW_ENABLED
            WORKFLOW_TIMEOUT_SECONDS=$WORKFLOW_TIMEOUT_SECONDS
            RERANK_REQUEST_TIMEOUT_SECONDS=$RERANK_REQUEST_TIMEOUT_SECONDS
            GENERATION_THINKING_LEVEL=minimal
            EMBEDDING_MODEL=$EMBEDDING_MODEL
            EMBEDDING_DIMENSION=768
            EMBEDDING_BATCH_PAUSE_SECONDS=$EMBEDDING_BATCH_PAUSE_SECONDS
            COHERE_API_KEY=$COHERE_API_KEY
            RERANK_MODEL=rerank-v4.0-pro
            RATE_LIMIT_RPM=10
            RATE_LIMIT_RPD=100
            MAX_QUERY_CHARS=4000
            MAX_COMPLETION_TOKENS=4096
            CORS_ORIGIN=https://$ANCHOR_DOMAIN
            LANGFUSE_HOST=$LANGFUSE_HOST
            LANGFUSE_PUBLIC_KEY=$LANGFUSE_PUBLIC_KEY
            LANGFUSE_SECRET_KEY=$LANGFUSE_SECRET_KEY
            LOG_LEVEL=INFO
            ANCHOR_ENV
            sudo chown root:anchor /etc/anchor/anchor.env
            sudo chmod 0640 /etc/anchor/anchor.env
            release_src="$(mktemp -d)"
            git clone https://github.com/VectorSigmaOmega/Anchor.git "$release_src"
            git -C "$release_src" checkout "$RELEASE_SHA"
            release_dir="/opt/anchor/releases/$RELEASE_ID"
            sudo mkdir -p "$release_dir"
            sudo rsync -a --delete --exclude .git "$release_src"/ "$release_dir"/
            rm -rf "$release_src"
            sudo chown -R "$USER":"$USER" "$release_dir"
            cd "$release_dir"
            python3 -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install .
            cd ui
            npm ci --no-audit --no-fund
            npm run build
            sudo mkdir -p /var/www/anchor/ui
            # Keep hashed assets referenced by pages already open in browsers.
            sudo rsync -a out/_next/ /var/www/anchor/ui/_next/
            sudo rsync -a --delete --exclude _next out/ /var/www/anchor/ui/
            cd "$release_dir"
            sudo chown -R anchor:anchor "$release_dir"
            sudo -u anchor bash -lc "cd '$release_dir' && set -a && . /etc/anchor/anchor.env && set +a && .venv/bin/python -m anchor.db.migrate"
            if [ "$RUN_REEMBED" = "true" ]; then
              sudo -u postgres pg_dump -d anchor --format=custom --table=public.documents --table=public.chunks --table=public.corpus_embedding_profile | sudo tee "/var/lib/anchor/corpus/pre-reembed-$RELEASE_ID.dump" >/dev/null
              sudo chmod 0600 "/var/lib/anchor/corpus/pre-reembed-$RELEASE_ID.dump"
              sudo -u anchor bash -lc "cd '$release_dir' && set -a && . /etc/anchor/anchor.env && set +a && .venv/bin/python -m anchor.ingest.reembed"
            fi
            if [ "$RUN_RECHUNK" = "true" ]; then
              sudo -u postgres pg_dump -d anchor --format=custom --table=public.documents --table=public.chunks --table=public.corpus_embedding_profile | sudo tee "/var/lib/anchor/corpus/pre-rechunk-$RELEASE_ID.dump" >/dev/null
              sudo chmod 0600 "/var/lib/anchor/corpus/pre-rechunk-$RELEASE_ID.dump"
              prepared_arg=""
              if sudo test -f /var/lib/anchor/corpus/prepared-rechunk.jsonl; then
                prepared_arg="--prepared-index /var/lib/anchor/corpus/prepared-rechunk.jsonl"
              fi
              sudo -u anchor bash -lc "cd '$release_dir' && set -a && . /etc/anchor/anchor.env && set +a && .venv/bin/python -m anchor.ingest.rechunk $prepared_arg"
            fi
            if [ "$RUN_INGEST" = "true" ]; then
              sudo -u anchor bash -lc "cd '$release_dir' && set -a && . /etc/anchor/anchor.env && set +a && .venv/bin/python -m anchor.ingest.cli"
            fi
            sudo install -m 0644 deploy/systemd/anchor-api.service /etc/systemd/system/anchor-api.service
            sudo install -m 0644 deploy/systemd/anchor-ingest.service /etc/systemd/system/anchor-ingest.service
            sudo systemctl daemon-reload
            sudo systemctl enable anchor-api
            sudo mkdir -p /etc/nginx/sites-enabled
            server_ip="$(curl -fsS https://api.ipify.org || hostname -I | awk '{print $1}')"
            domain_points_to_server="false"
            if getent ahostsv4 "$ANCHOR_DOMAIN" | awk '{print $1}' | sort -u | grep -Fx "$server_ip" >/dev/null; then
              domain_points_to_server="true"
            fi
            if sudo test -f "/etc/letsencrypt/live/$ANCHOR_DOMAIN/fullchain.pem" || [ "$domain_points_to_server" = "true" ]; then
              sudo sed "s/__ANCHOR_DOMAIN__/$ANCHOR_DOMAIN/g" deploy/nginx/anchor.tls.conf.template | sudo tee /etc/nginx/sites-available/anchor >/dev/null
              sudo ln -sfn /etc/nginx/sites-available/anchor /etc/nginx/sites-enabled/anchor
            else
              sudo tee /etc/nginx/sites-available/anchor >/dev/null <<ANCHOR_HTTP
            limit_req_zone \$binary_remote_addr zone=anchor_rpm:10m rate=10r/m;

            server {
                listen 80;
                listen [::]:80;
                server_name $ANCHOR_DOMAIN;

                root /var/www/anchor/ui;
                index index.html;

                add_header X-Frame-Options "DENY" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "same-origin" always;

                location = / {
                    expires -1;
                    try_files /index.html =404;
                }

                location /_next/ {
                    try_files \$uri =404;
                    access_log off;
                    expires 1h;
                }

                location /query {
                    limit_req_status 429;
                    limit_req zone=anchor_rpm burst=5 nodelay;
                    proxy_pass http://127.0.0.1:8010/query;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$remote_addr;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 30s;
                }

                location /chat-api/ {
                    proxy_pass http://127.0.0.1:8010/chat-api/;
                    proxy_http_version 1.1;
                    proxy_buffering off;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$remote_addr;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 75s;
                }

                location = /healthz {
                    proxy_pass http://127.0.0.1:8010/healthz;
                    proxy_set_header Host \$host;
                }

                location = /readyz {
                    allow 127.0.0.1;
                    deny all;
                    proxy_pass http://127.0.0.1:8010/readyz;
                }

                location = /metrics {
                    allow 127.0.0.1;
                    deny all;
                    proxy_pass http://127.0.0.1:8010/metrics;
                }

                location / {
                    expires -1;
                    try_files \$uri \$uri.html \$uri/ /index.html;
                }
            }
            ANCHOR_HTTP
              sudo ln -sfn /etc/nginx/sites-available/anchor /etc/nginx/sites-enabled/anchor
              echo "DNS for $ANCHOR_DOMAIN does not point to $server_ip yet; installed temporary HTTP-only nginx config."
            fi
            if ! sudo test -f "/etc/letsencrypt/live/$ANCHOR_DOMAIN/fullchain.pem" && [ "$domain_points_to_server" = "true" ]; then
              sudo mkdir -p /var/www/certbot
              sudo tee /etc/nginx/sites-available/anchor-bootstrap >/dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;
                server_name $ANCHOR_DOMAIN;
                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }
                location / {
                    return 200 'anchor bootstrap';
                }
            }
            EOF
              sudo ln -sfn /etc/nginx/sites-available/anchor-bootstrap /etc/nginx/sites-enabled/anchor
              sudo nginx -t
              sudo nginx -s reload
              sudo certbot certonly --webroot -w /var/www/certbot -d "$ANCHOR_DOMAIN" --agree-tos -m "$LETSENCRYPT_EMAIL" --non-interactive
              sudo ln -sfn /etc/nginx/sites-available/anchor /etc/nginx/sites-enabled/anchor
            fi
            sudo nginx -t
            sudo ln -sfn "$release_dir" /opt/anchor/.current-next
            sudo mv -Tf /opt/anchor/.current-next /opt/anchor/current
            sudo systemctl restart anchor-api
            curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:8010/readyz
            sudo nginx -s reload
